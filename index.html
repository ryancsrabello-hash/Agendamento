<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instituto Lins Rabello ERP</title>
<meta name="theme-color" content="#122A3A">
<meta name="description" content="Agenda, recepção, prontuário e gestão do Instituto Lins Rabello.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F9F8;
    --surface:#FFFFFF;
    --ink:#122A3A;
    --ink-soft:#5B7180;
    --teal:#2F8F86;
    --teal-deep:#1B5C56;
    --teal-soft:#E1F1EE;
    --coral:#FF6F59;
    --coral-soft:#FFE7E1;
    --amber:#E8A33D;
    --amber-soft:#FCEDD6;
    --danger:#D64550;
    --danger-soft:#FBE1E3;
    --success:#34A671;
    --success-soft:#E1F3EA;
    --grey-soft:#EDF1F0;
    --border:#DDE7E4;
    --shadow: 0 8px 24px -12px rgba(18,42,58,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #root{max-width:1180px;margin:0 auto;padding:0 24px 80px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* HEADER */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 0 18px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:46px;height:46px;border-radius:12px;
    background:#fff;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;flex-shrink:0;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-text{line-height:1.15;}
  .brand-text .name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16.5px;}
  .brand-text .sub{font-size:11.5px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;}
  .role-toggle{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px;gap:2px;}
  .role-toggle button{
    border:none;background:transparent;padding:8px 16px;border-radius:999px;
    font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:.15s;
  }
  .role-toggle button.active{background:var(--ink);color:#fff;}

  /* generic */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;}
  .pill.confirmado{background:var(--success-soft);color:var(--success);}
  .pill.realizado{background:var(--teal-soft);color:var(--teal-deep);}
  .pill.falta{background:var(--danger-soft);color:var(--danger);}
  .pill.cancelado{background:var(--grey-soft);color:var(--ink-soft);}
  .pill.pendente{background:var(--amber-soft);color:#9c6a1a;}
  .btn{border:none;border-radius:10px;padding:11px 20px;font-weight:600;font-size:14px;transition:.15s;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--teal-deep);}
  .btn-primary:disabled{background:#B9C4CA;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px;}
  input,select{
    width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
    font-family:inherit;font-size:14px;background:#fff;color:var(--ink);
  }
  input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;}
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}

  /* PATIENT HERO */
  .hero{padding:34px 0 8px;position:relative;}
  .hero h1{font-size:34px;line-height:1.12;margin:0 0 10px;letter-spacing:-.01em;position:relative;z-index:1;max-width:560px;}
  .hero p{color:var(--ink-soft);font-size:15.5px;max-width:520px;margin:0 0 28px;position:relative;z-index:1;}
  .hero-watermark{position:absolute;top:-10px;right:0;width:150px;opacity:.16;pointer-events:none;z-index:0;}
  @media (max-width:700px){.hero-watermark{display:none;}}

  .steps-track{display:flex;gap:6px;margin-bottom:22px;}
  .steps-track div{height:4px;flex:1;border-radius:3px;background:var(--border);}
  .steps-track div.done{background:var(--teal);}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .opt-card{
    text-align:left;border:1.5px solid var(--border);border-radius:14px;padding:16px;background:#fff;
    transition:.15s;
  }
  .opt-card:hover{border-color:var(--teal);}
  .opt-card.selected{border-color:var(--teal);background:var(--teal-soft);}
  .opt-card .t{font-weight:700;font-size:14.5px;margin-bottom:3px;}
  .opt-card .d{font-size:12.5px;color:var(--ink-soft);}
  .opt-card .price{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal-deep);font-weight:600;}

  .date-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .date-chip{
    flex:0 0 auto;border:1.5px solid var(--border);border-radius:12px;padding:10px 14px;background:#fff;
    text-align:center;min-width:64px;
  }
  .date-chip .wd{font-size:11px;color:var(--ink-soft);text-transform:uppercase;}
  .date-chip .dd{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
  .date-chip.selected{background:var(--ink);border-color:var(--ink);}
  .date-chip.selected .wd,.date-chip.selected .dd{color:#fff;}

  .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
  .slot{border:1.5px solid var(--border);border-radius:10px;padding:9px 6px;text-align:center;background:#fff;font-weight:600;font-size:13.5px;}
  .slot small{display:block;font-weight:500;color:var(--ink-soft);font-size:10.5px;margin-top:2px;}
  .slot.selected{background:var(--teal);border-color:var(--teal);color:#fff;}
  .slot.selected small{color:#eafaf7;}
  .slot.blocked{background:repeating-linear-gradient(45deg,var(--danger-soft),var(--danger-soft) 6px,#fff 6px,#fff 12px);border-color:var(--danger);color:var(--danger);}
  .slot.occupied{background:var(--grey-soft);border-color:var(--border);color:var(--ink-soft);cursor:not-allowed;}
  .block.blocked-slot{background:repeating-linear-gradient(45deg,#B9C4CA,#B9C4CA 6px,#98A6AC 6px,#98A6AC 12px)!important;}
  .empty-note{color:var(--ink-soft);font-size:13.5px;padding:14px 0;}

  .wizard-footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .summary-line{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed var(--border);}
  .summary-line:last-child{border-bottom:none;}

  .confirm-box{text-align:center;padding:40px 20px;}
  .confirm-logo{width:110px;margin:0 auto 18px;display:block;border-radius:14px;}
  .confirm-mark{width:56px;height:56px;border-radius:50%;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;}
  .gratitude-box{
    margin-top:20px;text-align:left;border-radius:14px;padding:18px 20px;
    background:linear-gradient(135deg,var(--teal-soft),#fff);
    border:1px solid var(--border);
  }
  .gratitude-box .g-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;color:var(--teal-deep);margin-bottom:6px;}
  .gratitude-box p{margin:0;font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
  .log-preview{text-align:left;background:var(--grey-soft);border-radius:12px;padding:14px 16px;margin-top:18px;font-size:13px;color:var(--ink-soft);}
  .log-preview div{padding:5px 0;}

  .lookup{margin-top:34px;padding-top:26px;border-top:1px solid var(--border);}
  .lookup h3{font-size:15px;margin:0 0 10px;}
  .lookup-row{display:flex;gap:8px;}
  .appt-mini{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
  .appt-mini:last-child{border-bottom:none;}
  .lookup-card{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border);}
  .lookup-card:last-child{border-bottom:none;}
  .lookup-card .dot{margin-top:6px;flex-shrink:0;width:10px;height:10px;}
  .lookup-card .info{flex:1;}
  .lookup-card .proc{font-weight:700;font-size:14px;}
  .lookup-card .meta{color:var(--ink-soft);font-size:12.5px;margin-top:2px;}
  .lookup-group-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;margin:14px 0 4px;}
  .lookup-group-title:first-child{margin-top:0;}

  /* STAFF GATE */
  .gate-wrap{max-width:380px;margin:60px auto;text-align:center;}
  .gate-wrap p{color:var(--ink-soft);font-size:13.5px;}
  .hint{font-family:'IBM Plex Mono',monospace;background:var(--amber-soft);color:#8a5c14;padding:8px 12px;border-radius:8px;font-size:12px;display:inline-block;margin-top:10px;}

  /* STAFF DASHBOARD */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;}
  .tabs button{background:none;border:none;padding:12px 16px;font-weight:600;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;}
  .tabs button.active{color:var(--ink);border-bottom-color:var(--teal);}

  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .kpi{padding:18px;}
  .kpi .label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .kpi .val{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;margin-top:6px;}
  .kpi .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  .section-title{font-size:16px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;}

  /* chair timeline (signature element) */
  .timeline-row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .timeline-row:last-child{border-bottom:none;}
  .prof-tag{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .track{position:relative;height:34px;background:var(--grey-soft);border-radius:8px;}
  .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(18,42,58,0.06);}
  .block{position:absolute;top:3px;bottom:3px;border-radius:6px;font-size:11px;color:#fff;display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;font-weight:600;}
  .hour-labels{display:grid;grid-template-columns:150px 1fr;margin-bottom:2px;}
  .hour-labels div{grid-column:2;position:relative;height:16px;font-size:10.5px;color:var(--ink-soft);}
  .hour-labels span{position:absolute;transform:translateX(-50%);}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 26px;font-size:12px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:11px 10px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .row-actions{display:flex;gap:6px;}
  .empty-state{padding:30px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  .two-col{display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;} .brand-text .sub{display:none;}}

  .fin-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  @media (max-width:640px){.fin-cards{grid-template-columns:1fr;} .kpi-grid{grid-template-columns:repeat(2,1fr);}}

  .bar-row{margin-bottom:14px;}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .bar-track{height:10px;background:var(--grey-soft);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}

  .log-item{padding:13px 0;border-bottom:1px solid var(--border);}
  .log-item:last-child{border-bottom:none;}
  .log-item .top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .log-item .msg{font-size:13.5px;}

  .warn-badge{background:var(--danger-soft);color:var(--danger);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;}
  footer.note{text-align:center;color:var(--ink-soft);font-size:11.5px;margin-top:40px;}
  .patient-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .patient-toolbar .search{flex:1;min-width:220px;}
  .patient-form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
  .patient-form-grid .span-2{grid-column:span 2;}
  .patient-form-grid .span-3{grid-column:1/-1;}
  .patient-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
  .patient-card-list{display:none;}
  .patient-history{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .patient-history-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .patient-history-row:last-child{border-bottom:none;}
  @media (max-width:780px){
    .patient-form-grid{grid-template-columns:1fr 1fr;}
    .patient-form-grid .span-3{grid-column:1/-1;}
  }
  @media (max-width:620px){
    .patient-form-grid{grid-template-columns:1fr;}
    .patient-form-grid .span-2,.patient-form-grid .span-3{grid-column:auto;}
    .patients-table-wrap{display:none;}
    .patient-card-list{display:grid;gap:10px;}
    .patient-mobile-card{border:1px solid var(--border);border-radius:12px;padding:14px;background:#fff;}
  }
  .loading{text-align:center;padding:80px 0;color:var(--ink-soft);}

  /* PRONTUÁRIO ELETRÔNICO */
  .record-shell{margin-top:18px;border-top:3px solid var(--teal);}
  .record-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;}
  .record-head h2{margin:0 0 4px;font-size:21px;}
  .record-tabs{display:flex;gap:5px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .record-tabs button{border:0;background:transparent;padding:10px 13px;font-weight:700;color:var(--ink-soft);border-bottom:2px solid transparent;white-space:nowrap;}
  .record-tabs button.active{color:var(--teal-deep);border-bottom-color:var(--teal);}
  .record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  .record-grid .full{grid-column:1/-1;}
  .record-checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0;}
  .record-check{display:flex;align-items:center;gap:8px;background:var(--grey-soft);padding:10px;border-radius:9px;font-size:13px;font-weight:600;}
  .record-check input{width:auto;}
  .odontogram{display:grid;grid-template-columns:repeat(8,minmax(48px,1fr));gap:8px;margin:14px 0;}
  .tooth{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:9px 4px;text-align:center;font-weight:700;font-size:13px;}
  .tooth small{display:block;font-size:9px;color:var(--ink-soft);font-weight:500;margin-top:3px;overflow:hidden;text-overflow:ellipsis;}
  .tooth.selected{border-color:var(--teal);background:var(--teal-soft);}
  .evolution-item{padding:14px 0;border-bottom:1px solid var(--border);}
  .evolution-item:last-child{border-bottom:0;}
  .evolution-meta{font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  textarea.record-textarea{width:100%;min-height:95px;padding:11px 13px;border-radius:10px;border:1px solid var(--border);font-family:inherit;resize:vertical;}
  .record-status{padding:12px;border-radius:10px;background:var(--grey-soft);font-size:13px;margin-bottom:14px;}
  @media(max-width:700px){.record-grid{grid-template-columns:1fr}.record-grid .full{grid-column:auto}.record-checks{grid-template-columns:1fr 1fr}.odontogram{grid-template-columns:repeat(4,1fr)}.record-head{flex-direction:column}.record-head .row-actions{width:100%}}


  .finance-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}.finance-tabs button{border:1px solid var(--border);background:#fff;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--ink-soft)}.finance-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .finance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}.finance-kpi{padding:17px}.finance-kpi .k-label{font-size:11px;text-transform:uppercase;color:var(--ink-soft);font-weight:700}.finance-kpi .k-value{font-family:'Space Grotesk';font-size:23px;font-weight:700;margin-top:5px}.finance-kpi .k-sub{font-size:11px;color:var(--ink-soft);margin-top:3px}.finance-form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.finance-form-grid .span-2{grid-column:span 2}.finance-form-grid .span-4{grid-column:span 4}.mini-note{font-size:11.5px;color:var(--ink-soft);line-height:1.5}.alert-card{background:var(--amber-soft);border:1px solid #efd19d;border-radius:12px;padding:12px 14px;font-size:12.5px}.good-card{background:var(--success-soft);border:1px solid #b9e4cf;border-radius:12px;padding:12px 14px;font-size:12.5px}.danger-card{background:var(--danger-soft);border:1px solid #efb7bd;border-radius:12px;padding:12px 14px;font-size:12.5px}.finance-table-wrap{overflow-x:auto}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.config-section{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--border)}.config-section:last-child{border-bottom:none}@media(max-width:760px){.finance-form-grid{grid-template-columns:1fr 1fr}.finance-form-grid .span-4{grid-column:span 2}.finance-form-grid .span-2{grid-column:span 2}}

  /* DASHBOARD E RELATÓRIOS */
  .dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px;}
  .dash-card{padding:18px;position:relative;overflow:hidden;}
  .dash-card .d-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;}
  .dash-card .d-value{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;margin-top:7px;}
  .dash-card .d-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .alert-list{display:grid;gap:8px;}
  .alert-item{padding:11px 13px;border-radius:10px;background:var(--amber-soft);font-size:13px;color:#775117;}
  .report-toolbar{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .report-toolbar .field{margin:0;min-width:180px;}
  .metric-table td:first-child{font-weight:600;}
  .positive{color:var(--success);}.negative{color:var(--danger);}
  @media(max-width:600px){.dash-grid{grid-template-columns:repeat(2,1fr)}.report-toolbar .field{width:100%;}.report-toolbar .btn{flex:1;}}

  /* ERP v2.0 — Recepção Inteligente */
  .pill.chegou{background:#E1F3EA;color:#16724B;}
  .pill.atendimento{background:#E4ECFA;color:#315FAD;}
  .reception-hero{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-bottom:18px;}
  .day-title{font-size:28px;margin:0 0 6px;}
  .day-sub{color:var(--ink-soft);margin:0;font-size:14px;}
  .next-patient{background:linear-gradient(135deg,var(--ink),var(--teal-deep));color:#fff;border:none;}
  .next-patient .muted{color:rgba(255,255,255,.72);font-size:12px;}
  .next-patient .big{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:8px 0 3px;}
  .reception-kpis{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
  .mini-kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:15px;}
  .mini-kpi .n{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;}
  .mini-kpi .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:4px;}
  .flow-list{display:flex;flex-direction:column;gap:10px;}
  .flow-card{display:grid;grid-template-columns:74px minmax(190px,1.3fr) minmax(150px,1fr) auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:15px;padding:14px 16px;box-shadow:0 5px 18px -16px rgba(18,42,58,.5);}
  .flow-card.late{border-left:5px solid var(--danger);}
  .flow-time{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:700;}
  .flow-name{font-weight:700;font-size:15px;}
  .flow-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .flow-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
  .flow-btn{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .flow-btn:hover{border-color:var(--teal);color:var(--teal-deep);}
  .flow-btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .flow-btn.success{background:var(--success-soft);border-color:transparent;color:#16724B;}
  .flow-btn.blue{background:#E4ECFA;border-color:transparent;color:#315FAD;}
  .flow-btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger);}
  .wait-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:18px;margin-top:22px;}
  .wait-item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
  .wait-item:last-child{border-bottom:none;}
  .version-badge{display:inline-flex;margin-left:7px;padding:2px 7px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep);font-size:9px;font-weight:700;vertical-align:middle;}
  .install-app{display:none;}
  @media(max-width:900px){.reception-hero{grid-template-columns:1fr}.reception-kpis{grid-template-columns:repeat(2,1fr)}.flow-card{grid-template-columns:62px 1fr}.flow-card>div:nth-child(3){grid-column:2}.flow-actions{grid-column:1/-1;justify-content:flex-start}.wait-grid{grid-template-columns:1fr}}



  /* DOCUMENTAÇÃO CLÍNICA v2.1 */
  .clinical-doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
  .clinical-doc-card{background:var(--grey-soft);border:1px solid var(--border);border-radius:14px;padding:16px;}
  .clinical-doc-card h3{margin:0 0 12px;font-size:16px;}
  .clinical-doc-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .clinical-doc-form .full{grid-column:1/-1;}
  .clinical-doc-list{display:grid;gap:10px;margin-top:14px;}
  .clinical-doc-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;}
  .clinical-doc-icon{width:42px;height:42px;border-radius:11px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;font-size:21px;}
  .clinical-doc-title{font-weight:700;font-size:14px;}
  .clinical-doc-meta{color:var(--ink-soft);font-size:12px;margin-top:3px;}
  .signature-wrap{border:1px dashed var(--ink-soft);border-radius:12px;background:#fff;padding:8px;}
  #clinical-signature{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair;}
  .upload-zone{border:2px dashed var(--border);border-radius:12px;padding:14px;background:#fff;text-align:center;}
  .doc-badge{display:inline-flex;padding:3px 8px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep);font-size:11px;font-weight:700;text-transform:uppercase;}
  .clinical-alert{padding:12px 14px;border-radius:10px;margin-bottom:12px;background:var(--success-soft);color:var(--teal-deep);font-size:13px;}
  @media(max-width:760px){.clinical-doc-grid,.clinical-doc-form{grid-template-columns:1fr}.clinical-doc-form .full{grid-column:auto}.clinical-doc-item{grid-template-columns:auto 1fr}.clinical-doc-item .row-actions{grid-column:1/-1}}


  /* v2.2 Segurança e produtividade clínica */
  .profile-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal-deep);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
  .clinical-alerts{display:grid;gap:8px;margin:14px 0 18px;}
  .clinical-alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:11px;background:var(--danger-soft);color:var(--danger);font-size:13px;font-weight:600;border:1px solid rgba(214,69,80,.18);}
  .clinical-alert.warning{background:var(--amber-soft);color:#8a5c14;border-color:rgba(232,163,61,.25);}
  .template-row{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 14px;}
  .template-chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .template-chip:hover{border-color:var(--teal);color:var(--teal-deep);}
  .autosave-status{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .autosave-dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
  .timeline-clinical{position:relative;padding-left:25px;margin:8px 0;}
  .timeline-clinical:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--border);}
  .timeline-entry{position:relative;padding:0 0 18px 8px;}
  .timeline-entry:before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--teal);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border);}
  .timeline-entry .date{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .timeline-entry .title{font-weight:700;margin:3px 0;}
  .audit-list{display:grid;gap:9px;}
  .audit-item{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#fff;}
  .audit-item .meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .permission-note{padding:14px;border-radius:12px;background:var(--amber-soft);color:#805510;font-size:13px;}

  /* v2.5 Financeiro Premium */
  .premium-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
  .progress-track{height:9px;border-radius:999px;background:var(--grey-soft);overflow:hidden}.progress-fill{height:100%;background:var(--success);border-radius:999px}
  .cash-row{display:grid;grid-template-columns:88px 1fr 110px 110px 120px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px}.cash-row.head{font-weight:700;color:var(--ink-soft);font-size:11px;text-transform:uppercase}.cash-in{color:var(--success);font-weight:700}.cash-out{color:var(--danger);font-weight:700}.cash-bal{font-weight:700}
  .bar-list{display:flex;flex-direction:column;gap:10px}.bar-line{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr 110px;gap:10px;align-items:center}.bar-track{height:10px;background:var(--grey-soft);border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:var(--ink);border-radius:999px}.bar-fill.good{background:var(--success)}.bar-fill.warn{background:var(--amber)}.bar-fill.bad{background:var(--danger)}
  .dre-table .summary-line{padding:10px 0}.dre-total{font-size:16px;border-top:2px solid var(--ink)!important;margin-top:5px;padding-top:14px!important}
  .trend-up{color:var(--success)}.trend-down{color:var(--danger)}
  @media(max-width:760px){.cash-row{grid-template-columns:70px 1fr 86px}.cash-row .cash-hide{display:none}.bar-line{grid-template-columns:1fr 1.2fr 85px}}
  /* v2.4 Estoque Inteligente */
  .stock-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0 18px}.stock-kpi{padding:16px}.stock-kpi .k{font-size:11px;text-transform:uppercase;color:var(--ink-soft);font-weight:700}.stock-kpi .v{font-family:'Space Grotesk';font-size:23px;font-weight:700;margin-top:4px}.stock-toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.stock-toolbar .field{margin:0;min-width:180px}.stock-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stock-form .span-2{grid-column:span 2}.stock-form .span-4{grid-column:span 4}.stock-alert{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:800}.stock-alert.low{background:var(--danger-soft);color:var(--danger)}.stock-alert.exp{background:var(--amber-soft);color:#8a5c14}.stock-alert.ok{background:var(--success-soft);color:var(--teal-deep)}.stock-move{font-size:12px;color:var(--ink-soft)}.recipe-row{display:grid;grid-template-columns:1.4fr .6fr auto;gap:8px;align-items:end;margin:8px 0}.stock-table-wrap{overflow-x:auto}.stock-table-wrap table{min-width:850px}@media(max-width:760px){.stock-form{grid-template-columns:1fr 1fr}.stock-form .span-4,.stock-form .span-2{grid-column:span 2}.recipe-row{grid-template-columns:1fr 90px auto}}


/* v2.6 Portal do Paciente */
.portal-hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:30px;border-radius:22px;background:linear-gradient(135deg,#0f3f3b,#1b6b62);color:#fff;margin-bottom:18px;box-shadow:0 18px 48px rgba(15,63,59,.18)}
.portal-hero h1{margin:4px 0 8px;font-size:clamp(26px,4vw,42px);line-height:1.08}.portal-hero p{margin:0;max-width:720px;color:rgba(255,255,255,.86)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;opacity:.72}.portal-lock{width:108px;height:108px;border-radius:24px;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;text-align:center}.portal-lock small{font-size:10px;margin-top:7px;color:#fff}.portal-welcome{display:flex;justify-content:space-between;align-items:center;gap:16px}.portal-welcome h2{margin:4px 0}.portal-welcome p{margin:0;color:var(--ink-soft)}.portal-kpi{text-align:center;background:var(--teal-soft);border-radius:16px;padding:14px 18px;min-width:130px}.portal-kpi strong{display:block;font-size:28px;color:var(--teal-deep)}.portal-kpi span{font-size:11px;color:var(--ink-soft)}.portal-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr);gap:16px;margin-top:16px}.portal-appt{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;border-top:1px solid var(--border);padding:16px 0}.portal-appt:first-of-type{border-top:0}.portal-date{width:64px;border-radius:14px;background:var(--grey-soft);padding:10px;text-align:center}.portal-date strong{display:block;font-size:17px}.portal-date span{font-size:12px;color:var(--ink-soft)}.portal-appt-main{display:flex;flex-direction:column;gap:4px}.portal-appt-main>span:not(.pill){font-size:12px;color:var(--ink-soft)}.portal-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.portal-info{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}.portal-info:last-child{border-bottom:0}.portal-info>span{font-size:22px}.portal-info p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.45}@media(max-width:760px){.portal-hero{grid-template-columns:1fr;padding:22px}.portal-lock{display:none}.portal-grid{grid-template-columns:1fr}.portal-welcome{align-items:flex-start}.portal-appt{grid-template-columns:58px 1fr}.portal-actions{grid-column:1/-1;justify-content:flex-start}.portal-date{width:54px;padding:8px}.portal-kpi{min-width:100px;padding:10px}.portal-kpi strong{font-size:22px}}

/* ---------------- date helpers ---------------- */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function isoOf(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }
function parseISO(iso){ var p=iso.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
function addDays(iso,n){ var d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d.getFullYear(),d.getMonth()+1,d.getDate()); }
function isSameMonth(iso, ref){ return iso.slice(0,7) === ref.slice(0,7); }
function weekdayShort(iso){ return parseISO(iso).toLocaleDateString('pt-BR',{weekday:'short'}).replace('.',''); }
function dayDisplay(iso){ var d=parseISO(iso); return pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function birthDisplay(iso){ if(!iso)return '—'; var m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m)return m[3]+'/'+m[2]+'/'+m[1]; var d=parseISO(iso); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); }
function fullDisplay(iso){ var d=parseISO(iso); return d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'}); }
function nowStamp(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes())+' · '+pad(d.getDate())+'/'+pad(d.getMonth()+1); }
function fmtMoney(v){ return 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function next14Days(){
  var out=[]; var d=todayISO();
  for(var i=0;i<16 && out.length<12;i++){
    var iso = addDays(d,i);
    if(parseISO(iso).getDay()!==0){ out.push(iso); } // skip Sundays
  }
  return out;
}
function timeSlots(){
  var out=[];
  for(var h=8; h<18; h++){
    for(var m=0;m<60;m+=30){
      if(h===12) continue; // lunch break
      out.push(pad(h)+':'+pad(m));
    }
  }
  return out;
}
function timeToMinutes(t){ var p=t.split(':'); return parseInt(p[0])*60+parseInt(p[1]); }

var realtimeChannel = null;

function normalizeStore(value){
  var base = seedStore();
  if(!value || typeof value !== 'object') return base;
  base.appointments = Array.isArray(value.appointments) ? value.appointments : [];
  base.patients = Array.isArray(value.patients) ? value.patients : [];
  base.expenses = Array.isArray(value.expenses) ? value.expenses : [];
  base.payments = Array.isArray(value.payments) ? value.payments : [];
  base.financeConfig = mergeFinanceConfig(value.financeConfig);
  base.logs = Array.isArray(value.logs) ? value.logs : [];
  base.blocks = Array.isArray(value.blocks) ? value.blocks : [];
  base.waitlist = Array.isArray(value.waitlist) ? value.waitlist : [];
  base.inventory = Array.isArray(value.inventory) ? value.inventory : defaultInventoryItems();
  base.inventoryMovements = Array.isArray(value.inventoryMovements) ? value.inventoryMovements : [];
  base.procedureRecipes = value.procedureRecipes && typeof value.procedureRecipes==='object' ? value.procedureRecipes : defaultProcedureRecipes();
  return base;
}

function readLocalStore(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? normalizeStore(JSON.parse(raw)) : null;
  }catch(e){
    console.warn('Não foi possível ler o cache local.', e);
    return null;
  }
}

function writeLocalStore(value){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(value)); }
  catch(e){ console.warn('Não foi possível atualizar o cache local.', e); }
}

function waitForSupabase(timeoutMs){
  return new Promise(function(resolve){
    if(window.ILRSupabase){ resolve(window.ILRSupabase); return; }

    var finished = false;
    function done(value){
      if(finished) return;
      finished = true;
      window.removeEventListener('ilr-supabase-ready', onReady);
      resolve(value);
    }
    function onReady(){ done(window.ILRSupabase || null); }

    window.addEventListener('ilr-supabase-ready', onReady, {once:true});
    setTimeout(function(){ done(window.ILRSupabase || null); }, timeoutMs || 8000);
  });
}

function startRealtime(api){
  if(realtimeStarted || !api || typeof api.subscribeStore !== 'function') return;
  realtimeStarted = true;
  realtimeChannel = api.subscribeStore(function(remoteStore){
    store = normalizeStore(remoteStore);
    writeLocalStore(store);
    render();
  });
}

function loadStore(cb){
  var localCopy = readLocalStore();

  waitForSupabase(8000).then(function(api){
    if(!api){
      store = localCopy || seedStore();
      writeLocalStore(store);
      cb();
      return;
    }

    api.loadStore().then(function(remoteStore){
      if(remoteStore){
        store = normalizeStore(remoteStore);
      }else{
        // Primeira execução: preserva e envia ao Supabase os dados já existentes no navegador.
        store = localCopy || seedStore();
        return api.saveStore(store);
      }
    }).then(function(){
      writeLocalStore(store);
      startRealtime(api);
      cb();
    }).catch(function(error){
      console.error('Falha ao carregar o Supabase; usando o cache local.', error);
      store = localCopy || seedStore();
      writeLocalStore(store);
      cb();
    });
  });
}

function persist(cb){
  store = normalizeStore(store);
  writeLocalStore(store);
  if(cb) cb();
  render();

  waitForSupabase(3000).then(function(api){
    if(!api) return;
    startRealtime(api);
    return api.saveStore(store);
  }).catch(function(error){
    console.error('Os dados ficaram salvos localmente, mas não foi possível sincronizar com o Supabase.', error);
  });
}

function resetDemo(){
  store = seedStore();
  persist();
}

/* ---------------- derived helpers ---------------- */
function profById(id){ for(var i=0;i<PROFESSIONALS.length;i++) if(PROFESSIONALS[i].id===id) return PROFESSIONALS[i]; return {id:id, name:'Profissional removido', spec:'', color:'#98A6AC'}; }
function procById(id){ for(var i=0;i<PROCEDURES.length;i++) if(PROCEDURES[i].id===id) return PROCEDURES[i]; return {id:id, name:'Procedimento removido', duration:30, price:0}; }

function busyRanges(professionalId, date){
  var ranges = [];
  store.appointments.forEach(function(a){
    if(a.professionalId===professionalId && a.date===date && a.status!=='cancelado' && a.status!=='falta'){
      var proc = procById(a.procedureId);
      var start = timeToMinutes(a.time);
      ranges.push([start, start + (proc ? proc.duration : 30)]);
    }
  });
  store.blocks.forEach(function(bl){
    if(bl.professionalId===professionalId && bl.date===date){
      var start = timeToMinutes(bl.time);
      ranges.push([start, start+30]);
    }
  });
  ranges.push([12*60, 13*60]); // horário de almoço, sempre fechado
  return ranges;
}
function rangesOverlap(s1,e1,s2,e2){ return s1 < e2 && e1 > s2; }

function isFreeSlot(professionalId, date, time, duration){
  var start = timeToMinutes(time);
  var end = start + (duration||30);
  if(end > 18*60) return false;
  var ranges = busyRanges(professionalId, date);
  for(var i=0;i<ranges.length;i++){
    if(rangesOverlap(start,end,ranges[i][0],ranges[i][1])) return false;
  }
  return true;
}

function slotBlocked(professionalId, date, time){
  return store.blocks.some(function(bl){ return bl.professionalId===professionalId && bl.date===date && bl.time===time; });
}
function slotOccupiedByAppointment(professionalId, date, time){
  var start = timeToMinutes(time), end = start+30;
  var ranges = [];
  store.appointments.forEach(function(a){
    if(a.professionalId===professionalId && a.date===date && a.status!=='cancelado' && a.status!=='falta'){
      var proc = procById(a.procedureId);
      var s = timeToMinutes(a.time);
      ranges.push([s, s+(proc?proc.duration:30)]);
    }
  });
  for(var i=0;i<ranges.length;i++){ if(rangesOverlap(start,end,ranges[i][0],ranges[i][1])) return true; }
  return false;
}

function availableSlots(professionalId, date, duration){
  duration = duration || 30;
  var slots = timeSlots();
  var out = [];
  if(professionalId==='any'){
    slots.forEach(function(t){
      for(var i=0;i<PROFESSIONALS.length;i++){
        var pid = PROFESSIONALS[i].id;
        if(isFreeSlot(pid, date, t, duration)){ out.push({time:t, professionalId:pid}); return; }
      }
    });
  } else {
    slots.forEach(function(t){ if(isFreeSlot(professionalId, date, t, duration)) out.push({time:t, professionalId:professionalId}); });
  }
  return out;
}

  if(found.length===0) return '<div class="empty-note">Nenhum agendamento encontrado para esse número.</div>';

  var today = todayISO();
  var upcoming = found.filter(function(a){ return a.date>=today && a.status!=='cancelado'; }).sort(function(a,b){ return (a.date+a.time)>(b.date+b.time)?1:-1; });

  d.cardRates=Object.assign({},d.cardRates,x.cardRates||{}); d.doctorRates=Object.assign({},d.doctorRates,x.doctorRates||{});

function paymentFeeRate(p,cfg){
  if(p.feeOverride!=='' && p.feeOverride!=null && !isNaN(Number(p.feeOverride))) return Number(p.feeOverride);
  var m=p.method||'Pix', inst=Number(p.installments||1), r=cfg.cardRates;
  if(m==='Débito') return n(r.debit); if(m==='Crédito'){ if(inst<=1)return n(r.credit1); if(inst<=6)return n(r.credit2to6); return n(r.credit7to12); } return 0;
}
function paymentNumbers(p,cfg){
  var gross=n(p.gross), discount=n(p.discount), billed=Math.max(0,gross-discount), fee=billed*paymentFeeRate(p,cfg)/100, net=Math.max(0,billed-fee);
  return {gross:gross,discount:discount,billed:billed,fee:fee,net:net};
}
function paymentByAppointment(id){ return (store.payments||[]).find(function(p){return p.appointmentId===id;})||null; }
function realizedAppointments(ref){ return store.appointments.filter(function(a){return a.status==='realizado'&&inMonth(a.date,ref);}); }
function financeSummary(ref){
  var cfg=mergeFinanceConfig(store.financeConfig), payments=(store.payments||[]).filter(function(p){return inMonth(p.date||p.paidDate,ref);}), realized=realizedAppointments(ref);
  var gross=0,discount=0,fees=0,received=0,pending=0;
  payments.forEach(function(p){var z=paymentNumbers(p,cfg);gross+=z.gross;discount+=z.discount;fees+=z.fee;if(p.status==='pago')received+=z.net;else pending+=z.net;});
  realized.forEach(function(a){if(!paymentByAppointment(a.id)) pending+=n(procById(a.procedureId).price);});
  var exp=(store.expenses||[]).filter(function(e){return inMonth(e.date,ref);}), expenses=0,fixed=0,variable=0,deductible=0,unpaidExp=0;
  exp.forEach(function(e){var v=n(e.value);expenses+=v;if(e.type==='fixa')fixed+=v;else variable+=v;if(e.deductible!==false)deductible+=v;if(e.paid===false)unpaidExp+=v;});
  var doctorCost=0, doctor={};
  PROFESSIONALS.forEach(function(prof){var hrs=0,rev=0;realized.filter(function(a){return a.professionalId===prof.id;}).forEach(function(a){hrs+=n(procById(a.procedureId).duration)/60;var pay=paymentByAppointment(a.id);rev+=pay?paymentNumbers(pay,cfg).billed:n(procById(a.procedureId).price);});var dc=cfg.doctorRates[prof.id]||{};var cost=hrs*n(dc.hourly)+rev*n(dc.commission)/100;doctorCost+=cost;doctor[prof.id]={hours:hrs,revenue:rev,cost:cost};});
  var taxable=Math.max(0,received-deductible-n(cfg.monthlyInss)); var ir=estimateIR2026(taxable,n(cfg.dependents)); if(cfg.taxMode==='custom')ir=received*n(cfg.customTaxRate)/100; if(cfg.taxMode==='none')ir=0;
  var iss=received*n(cfg.issRate)/100, taxes=ir+iss+n(cfg.monthlyInss), reserve=Math.max(0,received)*n(cfg.reserveRate)/100;
  var materialCost=0; realized.forEach(function(a){materialCost+=procedureMaterialCost(a.procedureId);});
  var proLabore=n((cfg.proLabore||{}).ryan)+n((cfg.proLabore||{}).amanda);
  var dreMaterial=cfg.includeMaterialCostInDre?materialCost:0;
  var result=received-expenses-doctorCost-taxes-reserve-proLabore-dreMaterial;
  var goal=n(cfg.monthlyGoal), goalPct=goal>0?received/goal*100:0;
  return {cfg:cfg,payments:payments,realized:realized,gross:gross,discount:discount,fees:fees,received:received,pending:pending,expenses:expenses,fixed:fixed,variable:variable,deductible:deductible,unpaidExp:unpaidExp,doctorCost:doctorCost,doctor:doctor,taxable:taxable,ir:ir,iss:iss,inss:n(cfg.monthlyInss),taxes:taxes,reserve:reserve,materialCost:materialCost,proLabore:proLabore,dreMaterial:dreMaterial,goal:goal,goalPct:goalPct,result:result};
}
function estimateIR2026(base,dependents){
  var b=Math.max(0,n(base)-n(dependents)*189.59), tax=0;
  if(b<=2428.80)tax=0; else if(b<=2826.65)tax=b*.075-182.16; else if(b<=3751.05)tax=b*.15-394.16; else if(b<=4664.68)tax=b*.225-675.49; else tax=b*.275-908.73;
  tax=Math.max(0,tax); var reduction=0; if(b<=5000)reduction=Math.min(tax,312.89); else if(b<=7350)reduction=Math.max(0,978.62-.133145*b); return Math.max(0,tax-reduction);
}

function procedureProfitability(ref){var f=financeSummary(ref),cfg=f.cfg,groups={};f.realized.forEach(function(a){var id=a.procedureId,p=procById(id),pay=paymentByAppointment(a.id),z=pay?paymentNumbers(pay,cfg):null,rev=z?z.billed:n(p.price),fee=z?z.fee:0,mat=procedureMaterialCost(id),dcfg=cfg.doctorRates[a.professionalId]||{},doc=n(p.duration)/60*n(dcfg.hourly)+rev*n(dcfg.commission)/100;var taxShare=f.received>0?f.taxes*(rev/f.received):0;var cost=fee+mat+doc+taxShare;if(!groups[id])groups[id]={id:id,name:p.name,count:0,revenue:0,cost:0,profit:0};groups[id].count++;groups[id].revenue+=rev;groups[id].cost+=cost;groups[id].profit+=rev-cost;});return Object.keys(groups).map(function(k){var g=groups[k];g.margin=g.revenue>0?g.profit/g.revenue*100:0;return g;}).sort(function(a,b){return b.profit-a.profit;});}

function patientBlank(){
  return {id:'',name:'',cpf:'',rg:'',birthDate:'',sex:'',phone:'',email:'',cep:'',address:'',number:'',complement:'',neighborhood:'',city:'',state:'SP',insurance:'',responsible:'',notes:'',sourcePhone:'',createdAt:''};
}

function patientRecords(){
  var map = {};
  (store.patients||[]).forEach(function(p){
    var item = Object.assign(patientBlank(), p);
    var key = item.id || ('saved-'+(item.phone||Math.random()));
    map[key] = item;
  });
  store.appointments.forEach(function(a){
    var phone = String(a.phone||'').replace(/\D/g,'');
    if(!phone) return;
    var existing = null;
    Object.keys(map).some(function(k){
      var p=map[k];
      if(String(p.phone||'').replace(/\D/g,'')===phone || String(p.sourcePhone||'').replace(/\D/g,'')===phone){ existing=p; return true; }
      return false;
    });
    if(!existing){
      map['auto-'+phone] = Object.assign(patientBlank(), {id:'auto-'+phone,name:a.name||'',phone:phone,sourcePhone:phone,createdAt:a.createdAt||''});
    }else if(!existing.name && a.name){ existing.name=a.name; }
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}

function patientHistory(p){
  var phones=[p.phone,p.sourcePhone].map(function(v){ return String(v||'').replace(/\D/g,''); }).filter(Boolean);
  return store.appointments.filter(function(a){ return phones.indexOf(String(a.phone||'').replace(/\D/g,''))>=0; })
    .sort(function(a,b){ return (a.date+a.time)<(b.date+b.time)?1:-1; });
}

function patientById(id){
  var list=patientRecords();
  for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  return null;
}

function initSignatureCanvas(){
  var canvas=document.getElementById('clinical-signature'); if(!canvas||canvas.dataset.ready)return; canvas.dataset.ready='1';
  var ctx=canvas.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#122A3A';var drawing=false;
  function point(e){var r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return {x:(p.clientX-r.left)*(canvas.width/r.width),y:(p.clientY-r.top)*(canvas.height/r.height)};}
  function start(e){drawing=true;var p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();}
  function move(e){if(!drawing)return;var p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();}
  function end(){drawing=false;}
  canvas.addEventListener('pointerdown',start);canvas.addEventListener('pointermove',move);window.addEventListener('pointerup',end);
}

  var existing=patientById(id);
  var savedIndex=-1;
  for(var i=0;i<store.patients.length;i++) if(store.patients[i].id===id){savedIndex=i;break;}
  var record=Object.assign(patientBlank(), existing||{}, form);
  if(!record.id || record.id.indexOf('auto-')===0){
    record.sourcePhone=record.sourcePhone || (existing&&existing.phone) || form.phone;
    record.id='p'+Date.now();
    record.createdAt=new Date().toISOString();
  }
  record.updatedAt=new Date().toISOString();
  if(savedIndex>=0) store.patients[savedIndex]=record; else store.patients.push(record);
  state.patientEditingId=record.id;
  state.patientMessage='Paciente salvo com sucesso.';auditAction('salvou paciente','paciente',record.id,{nome:record.name});
  persist();
}

function deletePatient(id){

function confirmBooking(){
  var b = state.booking;
  var nameEl = document.getElementById('inp-name'), phoneEl = document.getElementById('inp-phone');
  b.name = nameEl ? nameEl.value : b.name;
  var rawPhone = phoneEl ? phoneEl.value : b.phone;
  var digits = rawPhone.replace(/\D/g,'');

  if(b.name.trim().length<3){ b.error = 'Informe seu nome completo.'; render(); return; }
  if(digits.length!==11){ b.error = 'Informe o telefone com DDD + 9 dígitos (11 números), sem espaços ou traços.'; render(); return; }

  var proc = procById(b.procedureId);
  if(!isFreeSlot(b.professionalId, b.date, b.time, proc.duration)){
    b.error = 'Esse horário acabou de ser preenchido. Escolha outro horário.';
    b.step = 4; b.time = null; render(); return;
  }

  b.phone = digits;
  b.error = null;
  b.saving = true;
  render();

  waitForSupabase(8000).then(function(api){
    if(!api || typeof api.createPublicBooking !== 'function') throw new Error('Serviço de agendamento indisponível.');
    return api.createPublicBooking({
      procedureId:b.procedureId, professionalId:b.professionalId,
      date:b.date, time:b.time, name:b.name, phone:b.phone
    });
  }).then(function(newAppt){
    if(newAppt) store.appointments.push(newAppt);
    b.saving = false;
    b.done = true;
    writeLocalStore(store);
    render();
  }).catch(function(error){
    console.error('Erro ao criar agendamento:', error);
    b.saving = false;
    b.error = (error && error.message) ? error.message : 'Não foi possível concluir o agendamento.';
    if(b.error.indexOf('preenchido')>=0){ b.step=4; b.time=null; }
    render();
  });
}

function doLookup(){

  });
}

function doGate(){
  var emailEl = document.getElementById('inp-email');
  var passwordEl = document.getElementById('inp-password');
  var email = emailEl ? emailEl.value.trim() : '';
  var password = passwordEl ? passwordEl.value : '';

  if(!email || !password){
    state.gateError = 'Preencha o e-mail e a senha.';
    render();
    return;
  }

  state.gateLoading = true;
  state.gateError = false;
  render();

  waitForSupabase(8000).then(function(api){
    if(!api || typeof api.signIn !== 'function') throw new Error('A conexão com o Supabase não ficou disponível.');
    return api.signIn(email, password);
  }).then(function(user){
    return waitForSupabase(3000).then(function(api){
      if(!api || typeof api.isAuthorizedTeamMember !== 'function') return true;
      return api.isAuthorizedTeamMember();
    }).then(function(authorized){
      if(!authorized){
        return waitForSupabase(3000).then(function(api){
          if(api && typeof api.signOut === 'function') return api.signOut();
        }).then(function(){
          throw new Error('Este usuário não está autorizado para acessar a equipe clínica.');
        });
      }
      return waitForSupabase(3000).then(function(api){
        return api && typeof api.loadStore==='function' ? api.loadStore() : null;
      }).then(function(fullStore){
        if(fullStore) store = normalizeStore(fullStore);
        writeLocalStore(store);
        realtimeStarted = false;
        return waitForSupabase(2000).then(function(api){return api&&api.getTeamProfile?api.getTeamProfile():null;}).then(function(profile){state.staffProfile=profile||{role:'admin',display_name:''};state.role = 'staff';
        state.staffTab = allowedStaffTabs()[0];
        state.staffUser = user ? user.id : null;
        state.staffEmail = user ? user.email : email;
        state.gateLoading = false;
        state.gateError = false;
        waitForSupabase(1000).then(startRealtime);
        auditAction('entrou no sistema','sessao',state.staffUser,{});render();});
      });
    });
  }).catch(function(error){
    console.error('Erro no login:', error);
    state.gateLoading = false;
    state.gateError = (error && error.message && error.message.indexOf('não está autorizado')>=0) ? error.message : 'E-mail ou senha inválidos.';
    render();
  });
}

function doLogout(){
  waitForSupabase(5000).then(function(api){
    if(api && typeof api.signOut === 'function') return api.signOut();
  }).catch(function(error){
    console.error('Erro ao sair:', error);
  }).then(function(){
    return waitForSupabase(3000);
  }).then(function(api){
    return api && typeof api.loadStore==='function' ? api.loadStore() : seedStore();
  }).then(function(publicStore){
    store = normalizeStore(publicStore);
    writeLocalStore(store);
  }).catch(function(error){
    console.error('Erro ao atualizar dados públicos:', error);
    store = seedStore();
  }).finally(function(){
    state.role = 'gate';
    state.staffUser = null;
    state.staffEmail = null;
    state.staffProfile={role:'admin',display_name:''};
    state.gateError = false;
    realtimeStarted = false;
    render();
  });
}

function restoreStaffSession(cb){
  waitForSupabase(8000).then(function(api){
    if(!api || typeof api.getCurrentUser !== 'function') return null;
    return api.getCurrentUser();
  }).then(function(user){
    if(!user) return false;
    return waitForSupabase(3000).then(function(api){
      if(!api || typeof api.isAuthorizedTeamMember !== 'function') return true;
      return api.isAuthorizedTeamMember();
    }).then(function(authorized){
      if(authorized){
        state.staffUser = user.id;
        state.staffEmail = user.email || '';
        return waitForSupabase(2000).then(function(api){return api&&api.getTeamProfile?api.getTeamProfile():null;}).then(function(p){state.staffProfile=p||{role:'admin',display_name:''};return true;});
      }
      return authorized;
    });
  }).then(function(){
    if(cb) cb();
  }).catch(function(){ if(cb) cb(); });
}


function setReceptionStatus(id,status){
  var a=(store.appointments||[]).find(function(x){return x.id===id;}); if(!a)return;
  a.status=status; applyProcedureStock(a); auditAction('alterou status de consulta','agendamento',id,{status:status}); a.flowUpdatedAt=new Date().toISOString();

function openReceptionRecord(apptId){

var deferredInstallPrompt=null;

function cycleOrSetStatus(t){
  var id = t.dataset.id;
  var appt = null;
  for(var i=0;i<store.appointments.length;i++) if(store.appointments[i].id===id) appt = store.appointments[i];
  if(!appt) return;
  if(t.dataset.status){ appt.status = t.dataset.status; }
  else {
    var order = ['confirmado','chegou','atendimento','realizado','falta'];
    var idx = order.indexOf(appt.status);
    appt.status = order[(idx+1) % order.length];
  }
  applyProcedureStock(appt);
  persist();
}

function toggleBlock(time){
  var prof = state.agendaBlockProf, date = state.agendaDate;
  if(slotOccupiedByAppointment(prof, date, time)) return; // não permite bloquear horário já ocupado
  var idx = -1;
  for(var i=0;i<store.blocks.length;i++){
    if(store.blocks[i].professionalId===prof && store.blocks[i].date===date && store.blocks[i].time===time){ idx = i; break; }
  }
  if(idx>=0){ store.blocks.splice(idx,1); }
  else{ store.blocks.push({id:'b'+Date.now(), professionalId:prof, date:date, time:time}); }
  persist();
}

function preparePayment(apptId){
  var a=store.appointments.find(function(x){return x.id===apptId;}); if(!a)return; var p=paymentByAppointment(apptId);
  state.financeDraft=p?Object.assign({},p):{id:'',appointmentId:a.id,patient:a.name,procedureId:a.procedureId,professionalId:a.professionalId,date:a.date,gross:procById(a.procedureId).price,discount:0,method:'Pix',installments:1,status:'pago',feeOverride:'',notes:''}; render();
}
function savePayment(){
  function v(id){var e=document.getElementById(id);return e?e.value:'';}
  var d=state.financeDraft||{}, rec=Object.assign({},d,{patient:v('pay-patient'),gross:n(v('pay-gross')),discount:n(v('pay-discount')),method:v('pay-method'),installments:Math.max(1,n(v('pay-installments'))),status:v('pay-status'),date:v('pay-date')||todayISO(),feeOverride:v('pay-fee'),notes:v('pay-notes'),updatedAt:new Date().toISOString()});
  if(rec.gross<0){alert('Informe um valor válido.');return;} store.payments=store.payments||[]; var i=store.payments.findIndex(function(x){return x.appointmentId===rec.appointmentId;}); if(i>=0){rec.id=store.payments[i].id;store.payments[i]=rec;}else{rec.id='pay'+Date.now();rec.createdAt=new Date().toISOString();store.payments.push(rec);} state.financeDraft=null;state.financeMessage='Recebimento salvo e cálculos atualizados.';persist();
}
function saveFinanceConfig(){

  c.taxMode=v('cfg-tax-mode');c.dependents=n(v('cfg-dependents'));c.monthlyInss=n(v('cfg-inss'));c.issRate=n(v('cfg-iss'));c.customTaxRate=n(v('cfg-custom-tax'));c.reserveRate=n(v('cfg-reserve'));c.monthlyGoal=n(v('cfg-monthly-goal'));c.proLabore={ryan:n(v('cfg-prolabore-ryan')),amanda:n(v('cfg-prolabore-amanda'))};var md=document.getElementById('cfg-material-dre');c.includeMaterialCostInDre=!!(md&&md.checked);c.cardRates={debit:n(v('cfg-debit')),credit1:n(v('cfg-credit1')),credit2to6:n(v('cfg-credit26')),credit7to12:n(v('cfg-credit712')),anticipation:0};

function addExpense(){

function saveStockItem(id){
  function v(x){var e=document.getElementById(x);return e?e.value:'';}var name=v('st-name').trim();if(!name){alert('Informe o nome do material.');return;}var rec={id:id||('st'+Date.now()),name:name,category:v('st-cat'),unit:v('st-unit')||'un',qty:Math.max(0,n(v('st-qty'))),minQty:Math.max(0,n(v('st-min'))),cost:Math.max(0,n(v('st-cost'))),supplier:v('st-supplier'),lot:v('st-lot'),expiry:v('st-expiry'),updatedAt:new Date().toISOString()};var idx=(store.inventory||[]).findIndex(function(i){return i.id===rec.id;});if(idx>=0)store.inventory[idx]=rec;else store.inventory.push(rec);state.stockEditingId=null;state.stockMessage='Material salvo.';auditAction('salvou material de estoque','estoque',rec.id,{name:rec.name});persist();

function moveStock(id,type){var item=(store.inventory||[]).find(function(i){return i.id===id;});if(!item)return;var raw=prompt((type==='entrada'?'Quantidade de entrada':'Quantidade de saída')+' para '+item.name+':','1');if(raw===null)return;var qty=n(String(raw).replace(',','.'));if(qty<=0){alert('Informe uma quantidade maior que zero.');return;}if(type==='saida'&&qty>n(item.qty)){if(!confirm('A saída é maior que o estoque atual. Continuar e zerar o item?'))return;qty=n(item.qty);}var reason=prompt('Motivo / observação:',type==='entrada'?'Compra / reposição':'Uso / ajuste')||'';item.qty=Math.max(0,n(item.qty)+(type==='entrada'?qty:-qty));store.inventoryMovements=store.inventoryMovements||[];store.inventoryMovements.push({id:'mv'+Date.now(),itemId:id,itemName:item.name,type:type,qty:qty,reason:reason,createdAt:new Date().toISOString()});state.stockMessage='Movimentação registrada.';auditAction('movimentou estoque','estoque',id,{type:type,qty:qty});persist();}
function readCurrentRecipe(){var pid=state.recipeProcedure||'exodontia', old=(store.procedureRecipes||{})[pid]||[], arr=[];for(var i=0;i<old.length;i++){var e=document.getElementById('recipe-item-'+i),q=document.getElementById('recipe-qty-'+i);if(e&&q&&n(q.value)>0)arr.push({itemId:e.value,qty:n(q.value)});}return arr;}
function addRecipeRow(){var pid=state.recipeProcedure||'exodontia';store.procedureRecipes=store.procedureRecipes||{};store.procedureRecipes[pid]=readCurrentRecipe();var first=(store.inventory||[])[0];if(first)store.procedureRecipes[pid].push({itemId:first.id,qty:1});render();}

function saveRecipe(){var pid=state.recipeProcedure||'exodontia';store.procedureRecipes=store.procedureRecipes||{};store.procedureRecipes[pid]=readCurrentRecipe();state.stockMessage='Consumo padrão do procedimento salvo.';auditAction('alterou consumo padrão','procedimento',pid,{items:store.procedureRecipes[pid]});persist();}
function applyProcedureStock(appt){if(!appt||appt.stockPostedAt||appt.status!=='realizado')return;var recipe=(store.procedureRecipes||{})[appt.procedureId]||[];if(!recipe.length){appt.stockPostedAt=new Date().toISOString();return;}store.inventoryMovements=store.inventoryMovements||[];recipe.forEach(function(r){var item=(store.inventory||[]).find(function(i){return i.id===r.itemId;});if(!item)return;var requested=Math.max(0,n(r.qty)),used=Math.min(requested,n(item.qty));item.qty=Math.max(0,n(item.qty)-requested);store.inventoryMovements.push({id:'mv'+Date.now()+Math.random().toString(16).slice(2),itemId:item.id,itemName:item.name,type:'saida automática',qty:requested,reason:'Procedimento '+(procById(appt.procedureId).name||appt.procedureId)+' · '+(appt.name||'Paciente'),appointmentId:appt.id,createdAt:new Date().toISOString()});});appt.stockPostedAt=new Date().toISOString();auditAction('baixou estoque automaticamente','agendamento',appt.id,{procedureId:appt.procedureId});}
