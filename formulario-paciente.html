<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Instituto Lins Rabello — Formulário individual</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#183149;font:16px system-ui,sans-serif;line-height:1.55}main{max-width:760px;margin:30px auto;padding:24px;background:white;border-radius:16px;box-shadow:0 8px 36px #152c4210}header{border-bottom:2px solid #b29453;margin-bottom:24px;padding-bottom:14px}header strong{font-size:22px}header small{display:block;color:#687580}h1{font-size:26px}label{display:block;font-weight:600;margin:18px 0 6px}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:12px;border:1px solid #b7c2ce;border-radius:8px;background:white}textarea{min-height:100px}button{padding:12px 18px;border:0;border-radius:8px;background:#183149;color:white;font-weight:650;margin-top:20px;cursor:pointer;min-height:46px}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #aa8d42;outline-offset:3px}.note{background:#f3f5f8;border-radius:10px;padding:14px;color:#475c6d;font-size:14px}.document{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #ccd4dc;padding:20px;border-radius:10px;max-height:460px;overflow:auto}.check{display:flex;align-items:flex-start;gap:10px;font-weight:400}.check input{width:20px;min-width:20px;margin-top:4px}.error{color:#aa2638;background:#fff0f1;padding:12px;border-radius:8px}.success{color:#176347;background:#e9f7ef;padding:20px;border-radius:10px}fieldset{border:0;padding:0}small{display:block;color:#5d6e7e}#status{margin-top:18px}[hidden]{display:none!important}@media(max-width:600px){main{margin:0;border-radius:0;padding:20px;min-height:100vh}h1{font-size:24px}}
</style></head><body><main><header><strong>Instituto Lins Rabello</strong><small>Odontologia integrada · Formulário individual</small></header><div id="app"><h1>Acessar seu formulário</h1><p>Informe os quatro últimos dígitos do telefone que você cadastrou na clínica.</p><form id="access"><label for="code">Últimos quatro dígitos do telefone</label><input id="code" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" minlength="4" maxlength="4" required><button id="access-button">Abrir formulário</button></form><p class="note">O link dá acesso apenas a este formulário. Não encaminhe a outras pessoas.</p></div><div id="status" role="status" aria-live="polite"></div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://woeekpaqnbwtdvvqheit.supabase.co','sb_publishable_rCse-76DLO4a6Ye51JAPvg_BAQWh4bO',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'ilr-patient-form-public'}});
const token=new URLSearchParams(location.hash.slice(1)).get('t')||'';
const app=document.getElementById('app'),status=document.getElementById('status');let code='',kind='',busy=false;
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function message(text,error=true){status.className=error?'error':'success';status.textContent=text;}
function area(id,title,required=false){return '<label for="'+id+'">'+title+'</label><textarea id="'+id+'" maxlength="5000" '+(required?'required':'')+'></textarea>';}
function question(id,title){return '<label for="'+id+'">'+title+'</label><select id="'+id+'" required><option value="">Selecione</option><option value="sim">Sim</option><option value="nao">Não</option><option value="nao_sei">Não sei informar</option></select>';}
const cadastroFields=[['name','Nome completo do paciente','text','name',true],['birthDate','Data de nascimento','date','bday'],['cpf','CPF','text','off'],['rg','RG','text','off'],['phone','Telefone / WhatsApp com DDD','tel','tel',true],['email','E-mail','email','email'],['cep','CEP','text','postal-code'],['address','Rua / avenida','text','address-line1'],['number','Número','text','off'],['complement','Complemento','text','address-line2'],['neighborhood','Bairro','text','off'],['city','Cidade','text','address-level2'],['state','UF','text','address-level1'],['insurance','Convênio, se houver','text','off'],['responsible','Nome do responsável, quando necessário','text','off']];
function cadastroHtml(){let out='<h2>Dados do paciente</h2><p class="note">As informações preenchidas atualizarão seu cadastro na clínica. Campos opcionais deixados em branco manterão os dados já existentes. Informe os dados do paciente, mesmo se você for o responsável por responder.</p>';cadastroFields.forEach(([id,label,type,autocomplete,required])=>{out+='<label for="cad-'+id+'">'+label+(required?' *':' (opcional)')+'</label><input id="cad-'+id+'" type="'+type+'" autocomplete="'+autocomplete+'" '+(required?'required':'')+' '+(type==='date'?'max="'+new Date().toISOString().slice(0,10)+'" min="1900-01-01"':'maxlength="'+(id==='state'?2:200)+'"')+'>';});out+='<label for="cad-sex">Sexo (opcional)</label><select id="cad-sex"><option value="">Não informar / manter cadastro</option>'+['Feminino','Masculino','Outro','Prefiro não informar'].map(v=>'<option>'+v+'</option>').join('')+'</select>';return out;}
function collectCadastro(){const result={};cadastroFields.forEach(([id])=>{result[id]=value('cad-'+id);});result.sex=value('cad-sex');result.phone=result.phone.replace(/\D/g,'');result.cpf=result.cpf.replace(/\D/g,'');result.cep=result.cep.replace(/\D/g,'');result.state=result.state.toUpperCase();if(result.name.length<3)throw Error('Informe o nome completo do paciente.');if(!/^[0-9]{10,11}$/.test(result.phone))throw Error('Informe telefone com DDD e 10 ou 11 números.');if(result.cpf&&result.cpf.length!==11)throw Error('Confira o CPF: são 11 números.');if(result.cep&&result.cep.length!==8)throw Error('Confira o CEP: são 8 números.');return result;}
function showForm(data){
 kind=data.kind;let out='<h1>'+escapeHtml(data.title)+'</h1><p class="note">Responda com atenção. A equipe revisará as informações durante seu atendimento. Prazo: '+escapeHtml(new Date(data.expires_at).toLocaleString('pt-BR'))+'.</p><form id="response"><fieldset id="fields">';
 if(data.form_text)out+='<h2>Documento / orientações</h2><div class="document">'+escapeHtml(data.form_text)+'</div>';
 if(kind==='anamnese'){
  out+=cadastroHtml()+'<h2>Saúde e histórico clínico</h2>';
  out+=area('queixa_principal','Qual o motivo da consulta?',true);
  out+=question('allergy','Você tem alguma alergia?');out+=area('alergias','Quais alergias? Se não souber, descreva sua dúvida.');
  out+=question('medication','Você usa algum medicamento?');out+=area('medicamentos','Quais medicamentos e doses, se souber?');
  out+=question('hipertensao','Você tem hipertensão (pressão alta)?')+question('diabetes','Você tem diabetes?')+question('anticoagulante','Você usa anticoagulante?')+question('gestante','Você está gestante?')+question('cirurgia_previa','Você já realizou alguma cirurgia?');
  out+=area('historico_medico','Outros problemas de saúde, cirurgias ou acompanhamentos médicos');out+=area('observacoes','Outras informações que a equipe precisa saber');
 }else out+=area('observacoes','Informações solicitadas no documento / observações',kind==='documentacao');
 out+='<label for="files">Anexos (opcional)</label><input id="files" type="file" multiple accept="image/jpeg,image/png,application/pdf"><small>Até três arquivos JPG, PNG ou PDF, com até 2 MB cada.</small><label for="signer">Seu nome completo (ou do responsável pelo preenchimento)</label><input id="signer" autocomplete="name" minlength="3" maxlength="200" required><label class="check"><input id="accepted" type="checkbox" required><span>'+(kind==='anamnese'?'Confirmo que informei as respostas conforme meu conhecimento e autorizo seu envio à equipe para meu atendimento.':'Li o documento apresentado, confirmo o nome informado e concordo com o envio das informações à clínica.')+'</span></label><button id="send-button">Enviar à clínica</button></fieldset></form>';
 app.innerHTML=out;status.className='';status.textContent='';document.getElementById('response').addEventListener('submit',submit);
}
if(!/^[0-9a-f]{64}$/.test(token)){app.innerHTML='<h1>Link inválido</h1><p>Solicite um novo link ao Instituto Lins Rabello.</p>';}else document.getElementById('access').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;const b=document.getElementById('access-button');b.disabled=true;code=document.getElementById('code').value.trim();try{const {data,error}=await client.rpc('get_patient_form',{p_token:token,p_code:code});if(error)throw error;showForm(data);}catch(err){message('Não foi possível abrir. Confira os quatro dígitos; o link pode ter expirado ou já ter sido usado.');b.disabled=false;}finally{busy=false;}});
function value(id){return document.getElementById(id)?.value.trim()||'';}
function collectAnswers(){
 if(kind!=='anamnese')return {observacoes:value('observacoes')};
 const a={queixa_principal:value('queixa_principal'),historico_medico:value('historico_medico'),alergias:value('alergias'),medicamentos:value('medicamentos'),observacoes:value('observacoes')},unknown=[];
 for(const key of ['hipertensao','diabetes','anticoagulante','gestante','cirurgia_previa']){a[key]=value(key)==='sim';if(value(key)==='nao_sei')unknown.push(key);}
 if(value('allergy')==='sim'&&!a.alergias)throw Error('Descreva a alergia que informou.');if(value('allergy')==='nao')a.alergias='';if(value('allergy')==='nao_sei'){a.alergias=a.alergias||'Paciente não sabe informar se tem alergias.';unknown.push('alergias');}
 if(value('medication')==='sim'&&!a.medicamentos)throw Error('Descreva o medicamento que usa, mesmo que não saiba o nome.');if(value('medication')==='nao')a.medicamentos='';if(value('medication')==='nao_sei'){a.medicamentos=a.medicamentos||'Paciente não sabe informar os medicamentos.';unknown.push('medicamentos');}
 if(unknown.length)a.observacoes+='\nQuestões que o paciente não soube informar: '+unknown.join(', ')+'. Conferir na consulta.';
 a.respostas_desconhecidas=unknown;a.cadastro=collectCadastro();return a;
}
async function readFiles(){const files=Array.from(document.getElementById('files').files||[]);if(files.length>3)throw Error('Selecione até três arquivos.');const result=[];for(const file of files){if(!['image/jpeg','image/png','application/pdf'].includes(file.type)||file.size>2*1024*1024||file.size===0)throw Error('Use JPG, PNG ou PDF de até 2 MB por arquivo.');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(Error('Não foi possível ler o arquivo.'));reader.readAsDataURL(file);});result.push({name:file.name.slice(0,150),mime:file.type,data});}return result;}
async function submit(e){e.preventDefault();if(busy)return;busy=true;const fieldset=document.getElementById('fields');try{const answers=collectAnswers(),signer=value('signer'),accepted=document.getElementById('accepted').checked;fieldset.disabled=true;message('Enviando suas informações…',false);const files=await readFiles();const {error}=await client.rpc('submit_patient_form',{p_token:token,p_code:code,p_answers:answers,p_signer:signer,p_accepted:accepted,p_files:files});if(error)throw error;app.innerHTML='<h1>Informações recebidas</h1><div class="success">Seu formulário e os anexos foram enviados à sua ficha. Se você preencheu a anamnese, os dados informados também atualizaram seu cadastro. A equipe fará a revisão durante o atendimento.</div><p>Você já pode fechar esta página.</p>';status.className='';status.textContent='';code='';history.replaceState(null,'',location.pathname);}catch(err){fieldset.disabled=false;message(err.message||'Não foi possível enviar. Seus campos foram mantidos. Confira a conexão e tente novamente.');}finally{busy=false;}}
</script></body></html>
