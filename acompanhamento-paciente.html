<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Meu tratamento · Instituto Lins Rabello</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#183149;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:24px auto;padding:24px}header{border-bottom:2px solid #b29453;padding-bottom:16px}header strong{font-size:22px}header small{display:block}h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}section,article,.notice{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 22px #18314908}button,input{font:inherit;padding:12px;border-radius:8px}input{border:1px solid #adbcc8;max-width:220px;width:100%;display:block;margin:8px 0}button{border:0;background:#183149;color:white;cursor:pointer;min-height:46px;margin:8px 8px 0 0}button:disabled{opacity:.6}:focus-visible{outline:3px solid #b29453;outline-offset:3px}.badge{display:inline-block;padding:4px 12px;border-radius:24px;font-weight:650}.done{color:#176345;background:#def4e8}.pending{color:#755000;background:#fff0bf}.active{color:#1b5488;background:#e3efff}.muted{color:#586b79;font-size:14px}.error{color:#a42536}.line{border-left:3px solid #b29453;padding-left:14px;margin:12px 0}.progress{height:10px;background:#e7ebef;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#207858}.value{font-size:22px;font-weight:700}footer{font-size:14px;padding:20px 0} @media(max-width:600px){main{margin:0;padding:16px}h1{font-size:25px}section,article{padding:16px}}
</style></head><body><main><header><strong>Instituto Lins Rabello</strong><small>Seu tratamento, passo a passo</small></header><div id="app"><section><h1>Acompanhar meu tratamento</h1><p>Informe os quatro últimos dígitos do telefone cadastrado na clínica.</p><form id="access"><label for="code">Últimos quatro dígitos do telefone</label><input id="code" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" minlength="4" maxlength="4" required><button>Acessar meu plano</button></form><p class="muted">Este link é pessoal. Guarde-o e não compartilhe com outras pessoas.</p></section></div><div id="message" role="status" aria-live="polite"></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://woeekpaqnbwtdvvqheit.supabase.co','sb_publishable_rCse-76DLO4a6Ye51JAPvg_BAQWh4bO',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'ilr-tracking-public'}});
const token=new URLSearchParams(location.hash.slice(1)).get('t')||'',app=document.getElementById('app'),message=document.getElementById('message');let code='',busy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function date(v){return /^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.split('-').reverse().join('/'):'Data não informada';}
function show(data){let out='<h1>Olá, '+esc(data.patientName)+'!</h1><p>Confira o que foi contratado e acompanhe as etapas atualizadas pela equipe.</p><button id="refresh">Atualizar tratamento</button><button id="exit">Sair</button>';if(!data.plans.length)out+='<section><h2>Nenhum plano contratado disponível</h2><p>As propostas em negociação não aparecem aqui. Fale com a clínica para conferir seu plano.</p></section>';data.plans.forEach((q,index)=>{let pct=Math.round(q.completed/q.count*100);out+='<section><h2>Plano '+(index+1)+' · '+date(q.date)+'</h2><p><span class="badge '+(q.finished?'done':'active')+'">'+(q.finished?'Tratamento finalizado':'Tratamento não finalizado')+'</span></p><div class="progress" role="progressbar" aria-label="Procedimentos concluídos" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+pct+'%"></span></div><p>'+q.completed+' de '+q.count+' procedimentos finalizados</p><p class="value">'+(q.contractTotal!=null?'Valor do acordo: '+money(q.contractTotal):'Valor dos itens contratados: '+money(q.itemTotal))+'</p>'+(q.contractTotal!=null&&Math.abs(q.contractTotal-q.itemTotal)>.005?'<p class="muted">Soma dos itens antes do ajuste do acordo: '+money(q.itemTotal)+'. O valor combinado acima considera o acordo financeiro.</p>':'')+'</section>';q.items.forEach(i=>{out+='<article><h3>'+esc(i.description)+'</h3><p>Dente / região: '+esc(i.tooth||'Geral')+' · Quantidade: '+esc(i.quantity)+'</p><p><span class="badge '+(i.stage==='Finalizado'?'done':i.stage==='Em andamento'?'active':'pending')+'">'+esc(i.stage)+'</span></p><p>Valor unitário: '+money(i.unitPrice)+' · Total: <strong>'+money(i.value)+'</strong></p>';if(i.history.length)i.history.forEach(h=>{out+='<div class="line"><strong>'+esc(h.label)+'</strong><br>'+date(h.date)+(h.time?' às '+esc(h.time):' · Horário não informado')+'<br>'+esc(h.dentist)+'</div>';});else out+='<p class="muted">'+(i.stage==='Finalizado'?'Procedimento finalizado. Data, horário e dentista ainda não informados pela equipe.':'Ainda não há execução registrada para este procedimento.')+'</p>';out+='</article>';});});out+='<footer>'+esc(data.clinic.name)+'<br>'+esc(data.clinic.address||'')+'<br>'+esc(data.clinic.phone||'')+'<p>Atualizado em '+esc(new Date(data.updatedAt).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'}))+'. Link válido até '+esc(new Date(data.expiresAt).toLocaleDateString('pt-BR',{timeZone:'America/Sao_Paulo'}))+'.</p></footer>';app.innerHTML=out;document.getElementById('refresh').onclick=load;document.getElementById('exit').onclick=()=>{code='';location.reload();};}
async function load(){if(busy)return;busy=true;message.className='';message.textContent='Conferindo seu plano…';app.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await client.rpc('get_patient_tracking',{p_token:token,p_code:code});if(r.error)throw r.error;if(r.data.error)throw Error(r.data.error);show(r.data);message.textContent='';}catch(e){if(document.getElementById('refresh')){app.innerHTML='<section><h1>Acompanhamento indisponível</h1><p>Confira seu link ou solicite ajuda à clínica.</p><button id="retry">Tentar novamente</button></section>';document.getElementById('retry').onclick=load;}message.className='error';message.textContent=e.message||'Não foi possível acessar. Confira seu link e solicite ajuda à clínica.';}finally{busy=false;app.querySelectorAll('button').forEach(b=>b.disabled=false);}}
if(!/^[0-9a-f]{64}$/.test(token))app.innerHTML='<section><h1>Link inválido</h1><p>Solicite seu link individual de acompanhamento à clínica.</p></section>';else document.getElementById('access').onsubmit=e=>{e.preventDefault();code=document.getElementById('code').value.trim();load();};
</script></body></html>
